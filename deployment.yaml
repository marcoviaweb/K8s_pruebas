apiVersion: apps/v1 # Versión de la API de Kubernetes utilizada
kind: Deployment # Tipo de recurso que administra las réplicas de la aplicación
metadata:
  name: mi-pagina-web-deployment # Nombre del Deployment
  labels:
    app.kubernetes.io/name: mi-pagina-web
spec:
  replicas: 1 # Número de réplicas deseado
  selector:
    matchLabels:
      app.kubernetes.io/name: mi-pagina-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mi-pagina-web
    spec:
      containers:
        - name: mi-pagina-web # Nombre del contenedor
          image: mi-pagina-web-image:v1 # Usa una etiqueta versionada; debe coincidir con la imagen construida localmente
          imagePullPolicy: IfNotPresent # Reutiliza la imagen local o la descarga si hace falta
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
